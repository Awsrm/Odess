<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Odess · 个人生活管理工作台</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-512.png">
<meta name="theme-color" content="#0B0D0C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Odess">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <span class="logo"><img class="logo-img" src="avatar-odess.png" alt="Odess"/></span>
      <span class="logo-text">Odess</span>
      <button class="collapse-btn" id="collapseBtn" title="折叠/展开">‹</button>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <span class="foot-text">本地存储 · 隐私不出本机</span>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn" title="菜单">☰</button>
      <h1 class="topbar-title" id="topbarTitle">仪表盘</h1>
      <span class="topbar-date" id="topbarDate"></span>
      <button class="theme-toggle" id="themeToggle" title="切换日/夜模式">☾</button>
    </header>
    <section class="content" id="content"></section>
  </div>
</div>
<div class="overlay" id="overlay"></div>
<div class="modal-root" id="modalRoot"></div>
<script src="app.js"></script>
</body>
</html>
